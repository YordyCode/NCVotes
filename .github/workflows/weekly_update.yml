name: Weekly Voter Data Update

on:
  schedule:
    # 08:00 UTC Sunday (04:00 ET). NC SBE posts the snapshot on Saturday.
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Load strategy'
        type: choice
        default: 'truncate-first'
        options:
          - swap
          - in-place
          - truncate-first
      skip_scrape:
        description: 'Skip the download and use the committed file'
        type: boolean
        default: false

concurrency:
  group: voter-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PYTHONUNBUFFERED: '1'
      LOAD_MODE: ${{ inputs.mode || 'swap' }}

    steps:
      - name: Fail early if the database secret is missing
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set."
            echo "Use the Render EXTERNAL connection string."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report database space before the load
        run: python check_db_space.py

      - name: Run weekly update
        id: run
        run: |
          set +e
          ARGS="--mode $LOAD_MODE --only-columns config/load_columns.txt"
          if [ "${{ inputs.skip_scrape }}" = "true" ]; then ARGS="$ARGS --skip-scrape"; fi
          python weekly_update.py $ARGS
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -eq 137 ] || [ "$CODE" -eq 139 ]; then
            echo "::error::Process killed by the operating system (exit $CODE)."
            echo "::error::This is a runner memory or resource limit, not a database error."
          elif [ "$CODE" -ne 0 ]; then
            echo "::error::weekly_update.py exited with code $CODE. See the log tail below."
          fi
          tail -n 40 weekly_update.log || true
          exit $CODE

      - name: Report database space after the load
        if: always()
        continue-on-error: true
        run: python check_db_space.py

      - name: Remove downloaded source data
        if: always()
        run: |
          find data/raw -type f ! -name 'manifest.json' ! -name '.gitkeep' -delete || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-update-log
          path: weekly_update.log
          if-no-files-found: ignore

      - name: Commit regenerated outputs
        if: steps.run.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs data/raw/manifest.json
          if git diff --cached --quiet; then
            echo "No output changes to commit"
            exit 0
          fi
          git commit -m "chore: weekly voter data refresh $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Trigger Render deploy
        if: steps.run.outputs.exit_code == '0' && env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
