services:
  # Web service
  - type: web
    name: nc-elections
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 1 --timeout 120 -b 0.0.0.0:$PORT src.frontend.app:app"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nc-elections-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
  - type: cron
    name: nc-elections-weekly-pipeline
    env: python
    region: oregon
    plan: free
    schedule: "0 6 * * 0"   # Sundays 06:00 UTC; ignored if you only trigger manually
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_pipeline.py pipeline"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nc-elections-db
          property: connectionString

# PostgreSQL database
databases:
  - name: nc-elections-db
    plan: free
    databaseName: nc_elections
    user: nc_elections_user
